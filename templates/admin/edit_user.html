{% extends "base.html" %}

{% block title %}Edit User - QMIS DSR{% endblock %}

{% block extra_css %}
<style>
:root {
  --primary: #4361ee;
  --secondary: #f72585;
  --accent: #3ecf8e;
  --card-radius: 1.2rem;
  --card-shadow: 0 8px 32px rgba(67, 97, 238, 0.10);
  --header-bg: #f5f7fa;
  --form-bg: #fff;
  --border-color: #e0e0e0;
}
.edit-user-bg {
  background: #f8fafc;
  min-height: 100vh;
  padding: 0;
}
.card.edit-user-card {
  border-radius: var(--card-radius);
  box-shadow: var(--card-shadow);
  background: var(--form-bg);
  border: 1px solid var(--border-color);
}
.card-header.edit-user-header {
  background: var(--header-bg);
  border-bottom: 1px solid var(--border-color);
  border-radius: var(--card-radius) var(--card-radius) 0 0;
}
.card-title {
  color: var(--primary);
  font-weight: 700;
  letter-spacing: 0.02em;
}
.btn-primary {
  background: var(--primary) !important;
  border: none;
  font-weight: 600;
}
.btn-primary:hover {
  background: var(--secondary) !important;
  color: #fff;
}
.btn-outline-secondary {
  border: 1.5px solid var(--accent) !important;
  color: var(--accent) !important;
  font-weight: 600;
  background: #fff !important;
}
.btn-outline-secondary:hover {
  background: var(--accent) !important;
  color: #fff !important;
}
.form-label {
  color: var(--secondary);
  font-weight: 500;
}
.form-control, .form-select, .input-group-text {
  border-radius: 0.7rem;
  border-color: var(--border-color);
  background: #f7faff;
  padding: 0.75rem 1.25rem;
}
.form-control:focus, .form-select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 0.15rem rgba(67, 97, 238, 0.13);
}
.input-group-text {
  background: #f5f7fa;
  color: var(--primary);
  border-right: 0;
}
</style>
{% endblock %}

{% block content %}
<div class="edit-user-bg py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="card edit-user-card mb-4">
          <div class="card-header edit-user-header">
            <h3 class="card-title text-center mb-0"><i class="fas fa-user-edit me-2"></i>Edit User</h3>
          </div>
          <div class="card-body p-4">
            <form method="POST" action="{{ url_for('edit_user', user_id=user.user_id) }}" class="mt-3">
              <div class="mb-4">
                <label for="username" class="form-label">Username</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fas fa-user"></i></span>
                  <input type="text" class="form-control bg-light" id="username" name="username" value="{{ user.username }}" required>
                </div>
              </div>
              <div class="mb-4">
                <label for="password" class="form-label">Password <span class="text-muted">(leave blank to keep current)</span></label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fas fa-lock"></i></span>
                  <input type="password" class="form-control bg-light" id="password" name="password">
                </div>
              </div>
              <div class="mb-4">
                <label for="role" class="form-label">Role</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fas fa-user-tag"></i></span>
                  <select class="form-select" id="role" name="role" required>
                    <option value="">Select Role</option>
                    <option value="Admin" {% if user.role == 'Admin' %}selected{% endif %}>Admin</option>
                    <option value="Team Lead" {% if user.role == 'Team Lead' %}selected{% endif %}>Team Lead</option>
                    <option value="Team Member" {% if user.role == 'Team Member' %}selected{% endif %}>Team Member</option>
                    <option value="MD" {% if user.role == 'MD' %}selected{% endif %}>MD</option>
                  </select>
                </div>
              </div>
              <div class="mb-4">
                <label for="team_id" class="form-label">Team</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fas fa-users"></i></span>
                  <select class="form-select" id="team_id" name="team_id">
                    <option value="">Select Team</option>
                    {% for team in teams %}
                    <option value="{{ team.team_id }}" {% if user.team_id == team.team_id %}selected{% endif %}>{{ team.team_name }}</option>
                    {% endfor %}
                  </select>
                </div>
              </div>
              <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-primary py-3 fw-semibold">
                  <i class="fas fa-save me-2"></i>Save Changes
                </button>
                <a href="{{ url_for('manage_users') }}" class="btn btn-outline-secondary py-2">
                  <i class="fas fa-arrow-left me-2"></i>Cancel
                </a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
